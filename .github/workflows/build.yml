name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Por defecto, solo lectura. Únicamente el trabajo de publicar (con una etiqueta v*) puede escribir.
# Las acciones van fijadas a un commit concreto (no a una etiqueta, que se puede mover).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compilar
        shell: powershell
        run: .\build.ps1

      - name: Paquete MSI
        shell: powershell
        run: .\tools\build-msi.ps1

      - name: Sumas SHA-256
        shell: powershell
        run: |
          foreach ($f in 'Stackshot.exe', 'Stackshot.msi') {
            $h = (Get-FileHash "bin\$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Set-Content "bin\$f.sha256" -Encoding ascii
            Write-Host "$f SHA-256: $h"
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Stackshot
          path: |
            bin/Stackshot.exe
            bin/Stackshot.exe.sha256
            bin/Stackshot.msi
            bin/Stackshot.msi.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # crear la versión y subir los ficheros
      id-token: write      # firmar la procedencia (Sigstore)
      attestations: write  # guardar la atestación en GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Stackshot
          path: dist

      # Prueba verificable de que el .exe y el .msi salen de este código y de este flujo:
      #   gh attestation verify Stackshot.exe --repo rubenitx/stackshot
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Stackshot.exe
            dist/Stackshot.msi

      - name: Notas de la versión
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          exe=$(cut -d' ' -f1 dist/Stackshot.exe.sha256)
          msi=$(cut -d' ' -f1 dist/Stackshot.msi.sha256)
          {
            echo
            echo "### Download"
            echo
            echo "| File | For | SHA-256 |"
            echo "|---|---|---|"
            echo "| **[Stackshot.exe]($base/Stackshot.exe)** | Individual use: run it and follow the welcome window | \`$exe\` |"
            echo "| **[Stackshot.msi]($base/Stackshot.msi)** | IT deployment (Intune, SCCM, \`msiexec /i Stackshot.msi /qn\`) | \`$msi\` |"
            echo
            echo "Both install per user on Windows 10/11 without administrator rights."
            echo "Verify that a file was built from this repository: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`"
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: |
            dist/Stackshot.exe
            dist/Stackshot.exe.sha256
            dist/Stackshot.msi
            dist/Stackshot.msi.sha256
